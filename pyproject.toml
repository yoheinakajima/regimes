[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regimes"
version = "0.1.0"
description = "Autonomous eval-improvement loop on the ActiveGraph runtime."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.11.*"
authors = [{ name = "yohei" }]
dependencies = [
    "activegraph==1.0.5.post2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pip-tools>=7.4",
]

[project.scripts]
regimes = "regimes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
